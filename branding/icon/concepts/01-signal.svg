<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Signal: FluentFlow's mirrored taskbar visualizer, five bars whose envelope forms a lens, on the player's dark surface. -->
  <defs>
    <linearGradient id="s-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2433"/><stop offset="1" stop-color="#141117"/>
    </linearGradient>
    <linearGradient id="s-bar" gradientUnits="userSpaceOnUse" x1="0" y1="52" x2="0" y2="204">
      <stop offset="0" stop-color="#FBD3BE"/><stop offset="0.55" stop-color="#F0A88E"/><stop offset="1" stop-color="#D9785E"/>
    </linearGradient>
    <linearGradient id="s-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="216" height="216" rx="56" fill="url(#s-tile)"/>
  <rect x="21" y="21" width="214" height="214" rx="55" fill="none" stroke="url(#s-edge)" stroke-width="2"/>
  <g fill="url(#s-bar)">
    <rect x="45" y="100" width="22" height="56" rx="11"/>
    <rect x="81" y="76" width="22" height="104" rx="11"/>
    <rect x="117" y="52" width="22" height="152" rx="11"/>
    <rect x="153" y="76" width="22" height="104" rx="11"/>
    <rect x="189" y="100" width="22" height="56" rx="11"/>
  </g>
</svg>
