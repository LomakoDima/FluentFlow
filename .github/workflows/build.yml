name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # WPF and the Windows media APIs need Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FluentFlow.slnx

      - name: Build
        run: dotnet build FluentFlow.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FluentFlow.slnx -c Release --no-build

      - name: Publish
        run: dotnet publish FluentFlow/FluentFlow.csproj -c Release -r win-x64 --self-contained false -o publish

      - uses: actions/upload-artifact@v7
        with:
          name: FluentFlow-win-x64
          path: publish/
          if-no-files-found: error
